<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Chatly</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#ffffff;--text:#111b21;--sec:#667781;--accent:#1daa61;--accent2:#25d366;--brand:#1daa61;
  --chipbg:#f0f2f5;--chipt:#54656f;--chipon:#d8fdd2;--chipont:#15603e;--pill:#d8fdd2;
  --search:#f0f2f5;--div:#e9edef;--head:#ffffff;--icon:#54656f;--icon2:#111b21;
  --chat:#efeae2;--in:#ffffff;--out:#d9fdd3;--meta:#667781;--metaout:#667781;--read:#53bdeb;--tick:#8696a0;
  --day:#ffffff;--dayt:#54656f;--enc:#ffeecd;--enct:#54656f;--inbox:#ffffff;--quote:rgba(11,20,26,.05);--quoteout:rgba(0,80,40,.07);
  --sel:rgba(0,168,132,.15);--menu:#ffffff;--shadow:0 1px .5px rgba(11,20,26,.13);--sheet:#ffffff;--doodle:.07;--badge:#25d366;--badget:#ffffff;
  --red:#ea0038;--link:#027eb5;--mute:#8696a0;
}
[data-theme=dark]{
  --bg:#0b141a;--text:#e9edef;--sec:#8696a0;--accent:#21c063;--accent2:#21c063;--brand:#ffffff;
  --chipbg:#202c33;--chipt:#8696a0;--chipon:#103529;--chipont:#d8fdd2;--pill:#103529;
  --search:#202c33;--div:#222d34;--head:#0b141a;--icon:#aebac1;--icon2:#e9edef;
  --chat:#0b141a;--in:#202c33;--out:#144d37;--meta:#8696a0;--metaout:#a6b8b0;--read:#53bdeb;--tick:#a6b8b0;
  --day:#182229;--dayt:#8696a0;--enc:#182229;--enct:#ffd279;--inbox:#202c33;--quote:rgba(0,0,0,.2);--quoteout:rgba(0,0,0,.18);
  --sel:rgba(0,168,132,.2);--menu:#233138;--shadow:0 1px .5px rgba(0,0,0,.25);--sheet:#1f2c33;--doodle:.06;--badge:#21c063;--badget:#111b21;
  --red:#f15c6d;--link:#53bdeb;--mute:#8696a0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:Roboto,"Noto Sans","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:24px;height:24px;fill:currentColor}
.ibtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--icon2);flex:none}
.ibtn:active{background:rgba(127,127,127,.18)}
.noselect,.row,.crow,.nav,.topbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);height:100dvh}
.push{transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);z-index:10;visibility:hidden}
.push.show{transform:none;visibility:visible}
.push.z2{z-index:20}.push.z3{z-index:30}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hidden{display:none!important}

/* top bar */
.topbar{height:64px;display:flex;align-items:center;padding:0 4px 0 16px;flex:none;background:var(--bar)}
.topbar .title{flex:1;font-size:22px;font-weight:500;letter-spacing:.1px}
.topbar .brand{font-size:26px;font-weight:600;color:var(--brand);letter-spacing:-.2px}
.tab{display:none;flex-direction:column;flex:1;min-height:0}
.tab.on{display:flex}
.searchbox{margin:2px 16px 10px;height:46px;border-radius:24px;background:var(--search);display:flex;align-items:center;padding:0 14px;gap:12px;color:var(--sec)}
.searchbox input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.searchbox input::placeholder{color:var(--sec)}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:20px;background:var(--chipbg);color:var(--chipt);font-size:14.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--chipon);color:var(--chipont)}
.archrow{display:flex;align-items:center;padding:12px 16px 12px 30px;gap:30px;font-size:16px;font-weight:500}
.archrow .n{margin-left:auto;color:var(--accent);font-size:13px;font-weight:500}
.archrow svg{color:var(--sec)}
.crow{display:flex;align-items:center;gap:14px;padding:10px 16px;position:relative}
.crow:active{background:rgba(127,127,127,.08)}
.crow.sel{background:var(--sel)}
.av{border-radius:50%;flex:none;overflow:hidden;background:#dfe5e7;color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
[data-theme=dark] .av{background:#6a7175}
.av img{width:100%;height:100%;object-fit:cover}
img{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.av svg{width:62%;height:62%;fill:#fff}
.av .ini{font-weight:500;color:#fff}
.selck{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.selck svg{width:14px;height:14px;fill:#fff}
.cmain{flex:1;min-width:0}
.l1,.l2{display:flex;align-items:center;gap:6px}
.l1 .nm{flex:1;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .tm{font-size:12.5px;color:var(--sec);flex:none}
.l1 .tm.un{color:var(--accent);font-weight:500}
.l2{margin-top:2px}
.l2 .pv{flex:1;font-size:15px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px;min-width:0}
.l2 .pv span.t{overflow:hidden;text-overflow:ellipsis}
.l2 .pv.typing{color:var(--accent);font-weight:500}
.pv svg{flex:none}
.l2 .ico{color:var(--mute);flex:none}
.l2 .ico svg{width:19px;height:19px;fill:currentColor}
.badge{min-width:21px;height:21px;border-radius:11px;background:var(--badge);color:var(--badget);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
.badge.muted{background:var(--mute);color:#fff}
.listend{text-align:center;color:var(--sec);font-size:12.5px;padding:18px 0 110px;display:flex;align-items:center;justify-content:center;gap:4px}
.listend svg{width:12px;height:12px;fill:currentColor}
.fab{position:absolute;right:16px;bottom:96px;width:56px;height:56px;border-radius:16px;background:var(--fab);color:var(--fabicon);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.2);z-index:2}
.fab2{position:absolute;right:20px;bottom:166px;width:46px;height:46px;border-radius:14px;background:var(--chipbg);color:var(--icon2);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.15);z-index:2}
.nav{height:80px;flex:none;display:flex;border-top:1px solid var(--div);background:var(--bar);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--text)}
.nav .pillw{position:relative;width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.nav .on .pillw{background:var(--pill)}
.nav .on{font-weight:700}
.nav .nb{position:absolute;top:-2px;left:36px;min-width:20px;height:18px;border-radius:9px;background:var(--badge);color:var(--badget);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav .dot{position:absolute;top:3px;left:38px;width:9px;height:9px;border-radius:50%;background:var(--badge)}
.sect{font-size:20px;font-weight:600;padding:10px 16px 8px;display:flex;align-items:center}
.sect .r{margin-left:auto;font-size:14px;color:var(--accent);font-weight:500}
.statusrow{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 16px;scrollbar-width:none}
.statusrow::-webkit-scrollbar{display:none}
.scard{flex:none;width:96px;height:160px;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;padding:8px;background:#c9ced1}
.scard .who{position:absolute;left:8px;right:8px;bottom:8px;font-size:13px;font-weight:500;text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sav{position:absolute;left:8px;top:8px;border:2.5px solid var(--accent);border-radius:50%;padding:1.5px}
.scard .sav.seen{border-color:#bbbfc1}
.scard .txt{font-size:12.5px;font-weight:500;line-height:1.3;word-break:break-word}
.scard.mine{background:var(--chipbg);color:var(--text)}
.scard.mine .plus{position:absolute;left:38px;top:40px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.scard.mine .plus svg{width:14px;height:14px;fill:#fff}
.chrow{display:flex;align-items:center;gap:14px;padding:10px 16px}
.chrow .cav{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.followbtn{padding:6px 16px;border-radius:18px;background:var(--chipon);color:var(--chipont);font-weight:500;font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;padding:40px 30px;text-align:center;gap:14px;color:var(--sec)}
.empty h3{color:var(--text);font-size:20px;font-weight:500}
.btn{padding:10px 24px;border-radius:22px;background:var(--fab);color:var(--fabicon);font-weight:500;font-size:15px}
.callrow .l2 .pv svg{width:16px;height:16px}
.verified{width:16px;height:16px;flex:none}

/* chat */
#chat{background:var(--chat)}
.chat-head{height:64px;display:flex;align-items:center;flex:none;background:var(--head);color:var(--headt);padding:0 2px 0 0;gap:0;position:relative;z-index:3}
.chat-head .back{display:flex;align-items:center;padding:0 2px 0 6px;height:52px;border-radius:26px}
.chat-head .back:active{background:rgba(127,127,127,.15)}
.chat-head .who{flex:1;min-width:0;padding-left:8px;height:52px;display:flex;flex-direction:column;justify-content:center}
.chat-head .who .n{font-size:17.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who .s{font-size:13px;color:var(--headt);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chat-head .who .s.hl{color:var(--accent)}
.chat-head .ibtn{color:var(--headt)}
.selhead{position:absolute;inset:0;background:var(--head);display:flex;align-items:center;padding-right:4px;z-index:4}
.selhead .cnt{flex:1;font-size:20px;font-weight:500;padding-left:8px}
.chatbody{flex:1;position:relative;min-height:0;display:flex;flex-direction:column}
.wall{position:absolute;inset:0;pointer-events:none;opacity:var(--doodle);background-size:300px 300px}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:6px 0 8px;overscroll-behavior:contain;display:flex;flex-direction:column}
#msgs .spacer{flex:1}
.daychip{align-self:center;margin:8px auto 6px;background:var(--day);color:var(--dayt);font-size:12.5px;font-weight:500;padding:5px 12px;border-radius:8px;box-shadow:var(--shadow);text-transform:none}
.enc{align-self:center;margin:6px 26px 8px;background:var(--enc);color:var(--enct);font-size:12.5px;line-height:17px;padding:6px 12px;border-radius:8px;text-align:center;box-shadow:var(--shadow)}
.enc svg{display:inline;width:11px;height:11px;fill:currentColor;vertical-align:-1px;margin-right:3px}
.sys{align-self:center;margin:5px 40px;background:var(--day);color:var(--dayt);font-size:12.5px;padding:5px 12px;border-radius:8px;text-align:center;box-shadow:var(--shadow);line-height:17px}
.unreadbar{align-self:stretch;margin:8px 0;background:rgba(255,255,255,.45);text-align:center;padding:4px;font-size:12.5px;color:var(--dayt)}
[data-theme=dark] .unreadbar{background:rgba(0,0,0,.25)}
.unreadbar span{background:var(--day);padding:4px 12px;border-radius:12px;display:inline-block;box-shadow:var(--shadow)}
.row{display:flex;padding:1px 12px;position:relative;touch-action:pan-y;align-items:flex-start}
.row.first{margin-top:6px}
.row.out{justify-content:flex-end}
.row.selected::after{content:'';position:absolute;inset:-1px 0;background:var(--sel);pointer-events:none}
.row.hasr{margin-bottom:16px}
.row .gav{width:30px;flex:none;margin-right:6px}
.row .gav .av{width:30px;height:30px}
.bwrap{position:relative;max-width:82%;display:flex;transition:transform .05s}
.bub{position:relative;background:var(--in);border-radius:8px;padding:6px 8px 8px 9px;box-shadow:var(--shadow);color:var(--intext);font-size:15.6px;line-height:21px;word-wrap:break-word;overflow-wrap:anywhere;min-width:80px}
.out .bub{background:var(--out);color:var(--outtext)}
.row.first.in .bub{border-top-left-radius:0}
.row.first.out .bub{border-top-right-radius:0}
.row.first.in .bub::before{content:'';position:absolute;top:0;left:-8px;width:8px;height:13px;background:var(--in);clip-path:polygon(0 0,100% 0,100% 100%)}
.row.first.out .bub::before{content:'';position:absolute;top:0;right:-8px;width:8px;height:13px;background:var(--out);clip-path:polygon(0 0,100% 0,0 100%)}
.bub .snd{font-size:13.5px;font-weight:500;margin-bottom:1px;display:flex;gap:8px;align-items:baseline}
.bub .snd .ph{font-weight:400;color:var(--sec);font-size:12.5px}
.bub .tx{white-space:pre-wrap}
.bub .tx a{color:var(--link);text-decoration:underline}
.bub .tx.big{font-size:40px;line-height:48px}
.bub .tx.big2{font-size:32px;line-height:40px}
.sp{display:inline-block;height:1px;vertical-align:baseline}
.meta{position:absolute;right:7px;bottom:4px;display:flex;align-items:center;gap:3px;font-size:11px;color:var(--meta);white-space:nowrap;line-height:15px}
.out .meta{color:var(--metaout)}
.meta .st svg{width:11px;height:11px;fill:currentColor}
.tk{width:17px;height:11px;fill:none;stroke:var(--tick);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-left:1px}
.tk.read{stroke:var(--read)}
.tk.clk{width:12px;height:12px;stroke-width:1.3}
.fwd{font-size:12.5px;color:var(--sec);font-style:italic;display:flex;align-items:center;gap:4px;margin-bottom:2px}
.fwd svg{width:15px;height:15px;fill:currentColor}
.quote{background:var(--quote);border-radius:6px;padding:5px 8px 6px 10px;margin:-2px -4px 5px -5px;font-size:13.5px;line-height:18px;position:relative;overflow:hidden;display:flex;gap:6px}
.out .quote{background:var(--quoteout)}
.quote::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--qc,var(--accent))}
.quote .qn{font-weight:500;color:var(--qc,var(--accent));display:block}
.quote .qt{color:var(--sec);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.quote img{width:48px;height:48px;object-fit:cover;border-radius:4px;margin:-3px -6px -4px auto}
.del{font-style:italic;color:var(--sec);display:flex;align-items:center;gap:5px}
.del svg{width:16px;height:16px;fill:currentColor;flex:none}
.bub.img{padding:3px;min-width:0}
.bub.img .snd{padding:3px 5px 3px}
.bub.img img.ph{display:block;width:260px;max-width:100%;max-height:340px;object-fit:cover;border-radius:6px}
.bub.img .cap{padding:5px 5px 2px}
.bub.img.nocap .meta{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);bottom:8px;right:10px}
.bub.img.nocap .meta .tk{stroke:#fff}.bub.img.nocap .meta .tk.read{stroke:var(--read)}
.bub.img.nocap::after{content:'';position:absolute;left:3px;right:3px;bottom:3px;height:36px;border-radius:0 0 6px 6px;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
.voice{display:flex;align-items:center;gap:8px;width:250px;max-width:100%;padding:2px 0 12px}
.voice .vav{position:relative}
.voice .vav .av{width:46px;height:46px}
.voice .mic{position:absolute;right:-4px;bottom:-2px;width:20px;height:20px}
.voice .mic svg{width:20px;height:20px;fill:var(--accent)}
.voice.heard .mic svg{fill:var(--read)}
.voice .play{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--icon);flex:none}
.voice .play svg{width:30px;height:30px;fill:currentColor}
.voice .wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;position:relative}
.voice .wave i{flex:1;background:var(--tick);border-radius:2px;min-height:3px;opacity:.75}
.voice .wave i.pl{background:var(--accent);opacity:1}
.voice .wave .knob{position:absolute;left:0;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -3px;border-radius:50%;background:var(--accent)}
.voice.heard .wave .knob{background:var(--read)}
.voice .dur{position:absolute;left:66px;bottom:5px;font-size:11px;color:var(--meta)}
.out .voice .vav{order:3}
.out .voice .dur{left:46px}
.reacts{position:absolute;bottom:-17px;background:var(--in);border-radius:12px;padding:1px 5px;font-size:14px;line-height:20px;box-shadow:0 1px 3px rgba(0,0,0,.2);border:1px solid var(--chat);display:flex;gap:2px;align-items:center;z-index:1}
.reacts small{font-size:11.5px;color:var(--sec);margin-left:2px}
.in .reacts{left:8px}.out .reacts{right:8px}
.swipeicon{position:absolute;left:-40px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;opacity:0}
.swipeicon svg{width:18px;height:18px;fill:#fff}
.typingrow .bub{min-width:0;padding:10px 14px}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sec);opacity:.5;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:.9;transform:translateY(-3px)}}
.down{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:var(--day);box-shadow:0 1px 4px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--icon);z-index:2}
.down .badge{position:absolute;top:-8px;right:-2px}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:5px 6px 8px;position:relative;z-index:2}
.inbox{flex:1;background:var(--inbox);border-radius:24px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.inrow{display:flex;align-items:flex-end;min-height:48px}
.inrow .ibtn{width:44px;height:48px;border-radius:0;color:var(--icon)}
.inrow .ibtn:active{background:none;opacity:.6}
#ta{flex:1;border:0;outline:0;background:none;resize:none;font-size:17px;line-height:22px;padding:13px 0 13px 2px;max-height:136px;min-width:0;color:var(--text)}
#ta::placeholder{color:var(--sec)}
.sendb{width:48px;height:48px;border-radius:50%;background:var(--send);color:var(--sendicon);display:flex;align-items:center;justify-content:center;flex:none;touch-action:none}
.sendb svg{width:24px;height:24px;fill:currentColor}
.sendb.rec{transform:scale(1.6);transition:transform .15s}
.rpbox{margin:5px 5px 0;background:var(--quote);border-radius:8px;padding:7px 8px 7px 12px;position:relative;display:flex;gap:6px;font-size:13.5px;overflow:hidden}
.rpbox::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--qc,var(--accent))}
.rpbox .c{flex:1;min-width:0}
.rpbox .qn{color:var(--qc,var(--accent));font-weight:500}
.rpbox .qt{color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpbox button{color:var(--sec);align-self:flex-start}
.rpbox button svg{width:18px;height:18px;fill:currentColor}
.recbar{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--inbox);font-size:16px}
.recbar .rdot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.recbar .slide{margin-left:auto;margin-right:20px;color:var(--sec);font-size:14px}
@keyframes blink{50%{opacity:.2}}
.tip{position:absolute;right:12px;bottom:64px;background:#3b4a54;color:#fff;font-size:13.5px;padding:8px 14px;border-radius:8px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.emojipanel{flex:none;height:290px;background:var(--bg);overflow-y:auto;display:grid;grid-template-columns:repeat(8,1fr);padding:8px;gap:2px;align-content:start;border-top:1px solid var(--div)}
.emojipanel button{font-size:28px;height:44px}
.emojitabs{grid-column:1/-1;display:flex;justify-content:space-around;color:var(--sec);font-size:13px;padding:4px 0 8px}
.reactbar{position:fixed;z-index:70;background:var(--menu);border-radius:28px;padding:6px 8px;display:flex;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:pop .15s}
.reactbar button{font-size:28px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.reactbar button.on{background:rgba(127,127,127,.2)}
.reactbar .plus{font-size:20px;color:var(--sec);background:rgba(127,127,127,.15)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* menus & sheets */
.overlay{position:fixed;inset:0;z-index:50}
.overlay.dim{background:rgba(0,0,0,.4)}
.menu{position:absolute;top:8px;right:8px;background:var(--menu);border-radius:14px;padding:8px 0;min-width:210px;box-shadow:0 4px 18px rgba(0,0,0,.22);animation:pop .12s;transform-origin:top right}
.menu button{display:block;width:100%;text-align:left;padding:13px 20px;font-size:16px}
.menu button:active{background:rgba(127,127,127,.15)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;padding:14px 16px 26px;animation:up .2s}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--sec);opacity:.4;margin:0 auto 16px}
.attgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:8px 0}
.attgrid button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--sec)}
.attgrid .c{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--div)}
.attgrid .c svg{width:26px;height:26px}
.dialog{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:var(--menu);border-radius:24px;padding:22px 22px 12px;animation:pop .15s}
.dialog h4{font-size:18px;font-weight:500;margin-bottom:8px}
.dialog p{color:var(--sec);font-size:14.5px;margin-bottom:12px}
.dialog .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.dialog .acts.h{flex-direction:row;justify-content:flex-end;gap:8px}
.dialog .acts button{color:var(--accent);font-weight:500;padding:10px 12px;border-radius:20px;font-size:15px}
.dialog input{width:100%;border:0;border-bottom:2px solid var(--accent);background:none;outline:0;padding:8px 2px;font-size:17px;margin-bottom:14px}
.sheet{max-height:90dvh;overflow-y:auto}
.ef label{display:block;font-size:12.5px;color:var(--sec);margin:10px 0 4px}
.ef input[type=text],.ef input[type=time],.ef input[type=number],.ef select,.ef textarea{width:100%;background:var(--chipbg);border:0;border-radius:10px;padding:10px 12px;font-size:16px;outline:0;color:var(--text)}
.ef textarea{resize:vertical;min-height:70px;line-height:21px}
.ef input[type=color]{width:46px;height:42px;border:0;background:none;padding:0;flex:none}
.efh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.efh b{font-size:18px;font-weight:500}
.efsave{background:var(--fab);color:var(--fabicon);padding:8px 22px;border-radius:20px;font-weight:500;font-size:15px}
.efg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.efck{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px}
.efck label{display:flex;align-items:center;gap:7px;color:var(--text);font-size:15px;margin:0}
.efck input{width:18px;height:18px;accent-color:var(--accent)}
.efacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.efacts button{padding:8px 14px;border-radius:18px;background:var(--chipbg);font-size:14px;font-weight:500}
.efacts button.d{color:var(--red)}
.efcol{display:flex;gap:8px;align-items:center}
#editPillX{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:45;background:#ff9800;color:#111;font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;opacity:.92;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap}
#asChip{position:absolute;left:10px;top:-30px;background:var(--day);color:var(--text);font-size:13px;padding:4px 12px;border-radius:14px;box-shadow:var(--shadow);border:1px dashed #ff9800;z-index:3}
#chat.editing #msgs{padding-bottom:40px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 16px}
.trow .tl{flex:1;font-size:15px}
.trow input[type=color]{width:40px;height:34px;border:1px solid var(--div);border-radius:8px;background:none;padding:2px;flex:none}
.trow input[type=text]{width:104px;background:var(--chipbg);border:0;border-radius:8px;padding:7px 9px;font-size:14px;color:var(--text);outline:0;font-family:monospace}
.tgrp{padding:16px 16px 4px;font-size:13.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.tseg{display:flex;gap:8px;padding:6px 16px 4px;flex-wrap:wrap}
.tseg button{padding:7px 14px;border-radius:18px;background:var(--chipbg);color:var(--chipt);font-size:14px;font-weight:500}
.tseg button.on{background:var(--chipon);color:var(--chipont)}
.tseg .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dpg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.dpg button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;border-radius:12px;border:2px solid transparent}
.dpg button.on{border-color:var(--accent);background:var(--chipbg)}
.dpg img{width:46px;height:46px;border-radius:50%;object-fit:cover}
.dpg small{font-size:10.5px;color:var(--sec);line-height:1.15;text-align:center;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpx{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:14px;color:var(--sec)}
.dpx input{width:96px!important}
.dprev{font-size:12px;color:var(--sec);margin-top:4px;line-height:1.3}
.crow.lifted{background:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5;border-radius:12px}
.row.lifted,.sys.lifted{z-index:5}
.row.lifted .bub,.sys.lifted{box-shadow:0 8px 20px rgba(0,0,0,.28);transform:scale(1.02)}
.dragging-on{touch-action:none}
.hint2{margin:2px 16px 8px 60px;padding:10px 12px;border-radius:10px;background:var(--chipbg);color:var(--sec);font-size:13.5px;line-height:1.5}
.hint2 b{color:var(--text);font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#3b4a54;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:90;white-space:nowrap}

/* info */
.info{background:var(--bg)}
[data-theme=light] .info .scroll,.info .scroll{background:var(--bg)}
.infotop{display:flex;flex-direction:column;align-items:center;padding:4px 16px 18px}
.infotop .av{width:130px;height:130px}
.infotop h2{font-size:24px;font-weight:500;margin-top:14px;text-align:center}
.infotop .ph{color:var(--sec);font-size:16px;margin-top:4px}
.infoacts{display:flex;gap:10px;justify-content:center;padding:0 16px 18px}
.infoacts button{flex:1;max-width:96px;border:1px solid var(--div);border-radius:16px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;color:var(--text)}
.infoacts svg{fill:var(--accent);width:24px;height:24px}
.gap{height:8px;background:var(--div);opacity:.6}
[data-theme=dark] .gap{opacity:1;background:#070d11}
.irow{display:flex;align-items:center;gap:22px;padding:14px 20px;font-size:16px}
.irow svg{fill:var(--sec);width:22px;height:22px;flex:none}
.irow .sub{font-size:13.5px;color:var(--sec);margin-top:2px}
.irow.red{color:var(--red)}.irow.red svg{fill:var(--red)}
.irow .r{margin-left:auto;color:var(--sec);font-size:14px}
.ihead{padding:14px 20px 6px;font-size:14px;color:var(--sec);display:flex}
.ihead .r{margin-left:auto}
.media{display:flex;gap:6px;padding:4px 20px 14px;overflow-x:auto}
.media img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.adm{font-size:12px;color:var(--chipont);background:var(--chipon);padding:2px 7px;border-radius:6px;margin-left:auto}
.toggle{width:36px;height:20px;border-radius:10px;background:var(--sec);position:relative;margin-left:auto;flex:none}
.toggle::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--accent)}.toggle.on::after{left:19px}

/* status viewer */
#sviewer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:#fff}
#sviewer .bars{display:flex;gap:3px;padding:10px 8px 0}
#sviewer .bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden;position:relative}
#sviewer .bars i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}
#sviewer .shead{display:flex;align-items:center;gap:10px;padding:10px 6px}
#sviewer .shead .ibtn{color:#fff}
#sviewer .sbody{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;font-size:30px;text-align:center;line-height:1.3;font-weight:500}
#sviewer .sbody img{max-width:100%;max-height:100%}
#sviewer .sfoot{padding:16px;display:flex;gap:8px;align-items:center}
#sviewer .sfoot div{flex:1;border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:12px 18px;font-size:16px;color:rgba(255,255,255,.8)}

/* settings */
.prof{display:flex;align-items:center;gap:14px;padding:12px 16px 16px}
.prof .av{width:64px;height:64px}
.prof .n{font-size:20px}
.prof .a{color:var(--sec);font-size:14.5px}

/* studio */
#studio{background:#121417;color:#e8eaed;z-index:80;font-size:14px}
#studio .shd{height:56px;display:flex;align-items:center;gap:6px;padding:0 6px;background:#1c1f24;flex:none;border-bottom:1px solid #2b3037}
#studio .shd .ibtn{color:#e8eaed}
#studio .shd h3{flex:1;font-size:17px;font-weight:500}
#studio .sb{padding:12px 12px 80px}
#studio .card{background:#1c1f24;border:1px solid #2b3037;border-radius:12px;padding:12px;margin-bottom:12px}
#studio .card h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#8ab4f8;margin-bottom:10px;display:flex;align-items:center}
#studio .card h4 .r{margin-left:auto;text-transform:none;letter-spacing:0}
#studio label{display:block;font-size:12px;color:#9aa0a6;margin:8px 0 3px}
#studio input[type=text],#studio input[type=number],#studio input[type=time],#studio select,#studio textarea{width:100%;background:#121417;border:1px solid #3c4043;border-radius:8px;padding:9px 10px;color:#e8eaed;outline:0;font-size:15px}
#studio textarea{resize:vertical;min-height:60px}
#studio input:focus,#studio select:focus,#studio textarea:focus{border-color:#8ab4f8}
#studio .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#studio .g3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
#studio .dprev{color:#9aa0a6}
#studio .ck{display:flex;align-items:center;gap:8px;font-size:14px;color:#e8eaed;margin:8px 0 0}
#studio .ck input{width:18px;height:18px;accent-color:#8ab4f8}
#studio .ckrow{display:flex;flex-wrap:wrap;gap:4px 16px}
#studio .sbtn{background:#2b3037;color:#e8eaed;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500}
#studio .sbtn.p{background:#8ab4f8;color:#121417}
#studio .sbtn.d{background:#5c2b2b;color:#f6aea9}
#studio .sbtn.sm{padding:6px 10px;font-size:13px}
#studio .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#studio .clist button.ci{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border-bottom:1px solid #2b3037;text-align:left}
#studio .clist .ci .av{width:38px;height:38px}
#studio .clist .ci small{display:block;color:#9aa0a6;font-size:12px}
#studio .mcard{background:#16191d;border:1px solid #2b3037;border-radius:10px;padding:10px;margin-bottom:10px;border-left:4px solid #5f6368}
#studio .mcard.me{border-left-color:#34a853}
#studio .mcard .mh{display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa0a6}
#studio .mcard .mh b{color:#e8eaed;font-size:13px}
#studio .mcard .mh .sp2{flex:1}
#studio .mcard .mh button{color:#9aa0a6;padding:4px 6px;font-size:16px}
#studio .hint{font-size:12.5px;color:#9aa0a6;line-height:1.45;margin-top:6px}
#studio .avedit{display:flex;align-items:center;gap:12px}
#studio .avedit .av{width:64px;height:64px}
#studio .mem{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#studio .mem input[type=color]{width:38px;height:38px;border:0;background:none;padding:0;flex:none}
#studio .tabs2{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
#studio .tabs2 button{padding:8px 14px;border-radius:18px;background:#2b3037;font-size:13.5px;white-space:nowrap}
#studio .tabs2 button.on{background:#8ab4f8;color:#121417}
</style>

function lastSeenText(c){const d=c.lsDay|0;const t=fmtTime(c.lsTime||'09:00');if(d==0)return 'last seen today at '+t;if(d==1)return 'last seen yesterday at '+t;const dd=dayStart(d);if(d<7)return 'last seen '+WD[dd.getDay()]+' at '+t;return 'last seen '+dd.getDate()+' '+MO[dd.getMonth()].slice(0,3)+' at '+t}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,'<a>$1</a>').replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g,'$1<i>$2</i>').replace(/~([^~\n]+)~/g,'<s>$1</s>')}
function emojiCount(s){s=(s||'').trim();if(!s||s.length>40)return 0;try{const seg=[...new Intl.Segmenter().segment(s)].map(x=>x.segment).filter(x=>x.trim());if(seg.length>3)return 0;for(const g of seg)if(!/\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g))return 0;return seg.length}catch(e){return 0}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function resizeImg(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',q||.82))};im.src=r.result};r.readAsDataURL(file)})}
function pickFile(inp,cb){const el=$(inp);el.value='';el.onchange=()=>{if(el.files[0])cb(el.files[0])};el.click()}

/* ================= LAYERS / BACK ================= */
const layers=[];let afterPop=null;
function pushLayer(close){layers.push(close);history.pushState({l:layers.length},'')}
function back(cb){if(cb)afterPop=cb;history.back()}
addEventListener('popstate',()=>{const f=layers.pop();if(f)f();const cb=afterPop;afterPop=null;if(cb)setTimeout(cb,20)});
function showScreen(id,onClose){const el=$('#'+id);el.classList.add('show');pushLayer(()=>{el.classList.remove('show');onClose&&onClose()})}

function avatarHTML(o,size,isGroup){const s=`width:${size}px;height:${size}px`;const src=o?(imgSrc(o.avatar)||personPhoto(o.name)):null;if(src)return `<div class="av" style="${s}"><img src="${src}"></div>`;
 if(o&&o.initials){return `<div class="av" style="${s};background:${o.color||COLORS[hash(o.name)%COLORS.length]}"><span class="ini" style="font-size:${size*.4}px">${esc((o.name||'?').trim()[0]||'?')}</span></div>`}
 return `<div class="av" style="${s}"><svg viewBox="0 0 24 24"><path d="${isGroup?P.group:P.person}"/></svg></div>`}
const chatAv=(c,size)=>avatarHTML(c,size,c.type==='group');
function member(c,id){if(id==='me')return {id:'me',name:'You',color:'var(--accent)'};if(c.type==='group')return c.members.find(x=>x.id===id)||{name:'Unknown',color:'#888'};return {id:'them',name:c.name,color:'#1f7aec'}}
function grp0(c,m){if(m.from==='me'||m.from==='sys')return {name:'You'};const mem=c.type==='group'?member(c,m.from):{name:c.name,avatar:c.avatar};return m.sname?{name:m.sname,avatar:null}:mem}
function senderName(c,m){if(m.from!=='me'&&m.sname)return m.sname;return m.from==='me'?'You':(c.type==='group'?member(c,m.from).name:c.name)}
function realMsgs(c){return c.messages.filter(m=>m.type!=='system')}
function lastMsg(c){return c.messages[c.messages.length-1]}
function msgPreviewText(m){if(m.type==='image')return m.text||'Photo';if(m.type==='voice')return m.dur||'0:05';if(m.type==='deleted')return m.from==='me'?'You deleted this message':'This message was deleted';return m.text}
function isTyping(c){return c._typing}
function chatSub(c){
 if(c._typing)return {t:c.type==='group'?(member(c,c._typing).name+' is typing…'):'typing…',hl:true};
 if(c.type==='group'){const n=c.members.map(x=>x.name).concat('You');return {t:n.join(', ')}}
 if(c._online)return {t:'online'};
 switch(c.status){case 'online':return {t:'online'};case 'typing':return {t:'typing…',hl:true};case 'lastseen':return {t:lastSeenText(c)};case 'custom':return {t:c.customStatus||''};default:return {t:''}}}

 }

 ['chats','updates','communities','calls'].forEach(t=>$('#tab-'+t).classList.toggle('on',t===tab));

 if(tab==='chats')renderChats();else if(tab==='updates')renderUpdates();else if(tab==='communities')renderCommunities();else renderCalls();

function renderNav(){
 const unreadChats=S.chats.filter(c=>c.unread>0&&!c.archived&&!c.muted).length;
 const items=[['chats','Chats'],['updates','Updates'],['communities','Communities'],['calls','Calls']];
 $('#nav').innerHTML=items.map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}"><span class="pillw">${NAVI[k](tab===k)}${k==='chats'&&unreadChats?`<span class="nb">${unreadChats}</span>`:''}${k==='updates'&&S.chats.some(c=>c.hasStatus&&!c.statusSeen)?'<span class="dot"></span>':''}</span>${l}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(chatSel.size)return;tab=b.dataset.t;renderHome()});
}
function renderFabs(){
 const f=$('#fabs');
 if(tab==='chats')f.innerHTML=`<button class="fab" id="fab">${ic('newchatplus')}</button>`;
 else if(tab==='updates')f.innerHTML=`${S.settings.fab2?`<button class="fab2">${ic('edit',22)}</button>`:''}<button class="fab" id="fab">${ic('cam')}</button>`;
 else if(tab==='calls')f.innerHTML=`<button class="fab" id="fab"><svg class="ic" viewBox="0 0 24 24"><path d="${P.call}"/><path d="M15 3h2v3h3v2h-3v3h-2V8h-3V6h3z"/></svg></button>`;
 else f.innerHTML='';

function visibleChats(){
 const q=$('#search').value.trim().toLowerCase();
 let l=S.chats.filter(c=>!!c.archived===showArchived);
 if(!showArchived){if(filter==='unread')l=l.filter(c=>c.unread>0);if(filter==='fav')l=l.filter(c=>c.favourite);if(filter==='groups')l=l.filter(c=>c.type==='group');}
 if(q)l=S.chats.filter(c=>c.name.toLowerCase().includes(q)||c.messages.some(m=>(m.text||'').toLowerCase().includes(q)));
 const key=c=>{const m=lastMsg(c);return m?tsOf(m.day,m.t):0};
 const ord=c=>c.ord===undefined||c.ord===null?Infinity:c.ord;
 return l.slice().sort((a,b)=>(!!b.pinned-!!a.pinned)||(S.settings.manualOrder?((ord(a)-ord(b))||key(b)-key(a)):key(b)-key(a)));
}
function bumpChat(c){if(!S.settings.manualOrder)return;const mn=Math.min(0,...S.chats.filter(x=>x.ord!==undefined&&x.ord!==null).map(x=>x.ord));c.ord=mn-1}
function chatRowHTML(c){
 const m=lastMsg(c);const un=c.unread>0;let pv='';
 if(c._typing)pv=`<div class="pv typing"><span class="t">${esc(chatSub(c).t)}</span></div>`;
 else if(m){let pre='';
  if(m.type==='system')pre='';
  else if(m.from==='me'&&m.type!=='deleted')pre=`<span class="st">${tickHTML(m.status)}</span>`;
  else if(c.type==='group')pre=`<span>${esc(senderName(c,m))}: </span>`;
  let icn='';if(m.type==='image')icn=ic('image',17,'fill:var(--sec)');if(m.type==='voice')icn=ic('mic',17,`fill:${m.from!=='me'&&!m.heard?'var(--accent)':'var(--sec)'}`);if(m.type==='deleted')icn=ic('block',16,'fill:var(--sec)');
  pv=`<div class="pv">${pre}${icn}<span class="t" ${m.type==='deleted'?'style="font-style:italic"':''}>${esc(msgPreviewText(m))}</span></div>`}
 else pv='<div class="pv"></div>';
 const icons=`${c.muted?`<span class="ico">${ic('mute')}</span>`:''}${c.pinned&&!showArchived?`<span class="ico">${ic('pin')}</span>`:''}${un?`<span class="badge ${c.muted?'muted':''}">${c.unread}</span>`:''}`;
 return `<div class="crow ${chatSel.has(c.id)?'sel':''}" data-id="${c.id}" data-pin="${c.pinned?1:0}"><div style="position:relative">${chatAv(c,52)}${chatSel.has(c.id)?`<div class="selck">${ic('check')}</div>`:''}</div><div class="cmain"><div class="l1"><div class="nm">${esc(c.name)}</div><div class="tm ${un&&!c.muted?'un':''}">${m?listTime(m.day,m.t):''}</div></div><div class="l2">${pv}${icons}</div></div></div>`;
}
function renderChats(){
 const ch=[['all','All'],['unread','Unread'+(S.chats.filter(c=>c.unread>0&&!c.archived).length?' '+S.chats.filter(c=>c.unread>0&&!c.archived).length:'')],['fav','Favourites'],['groups','Groups']];
 $('#chips').innerHTML=showArchived?'':ch.map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('')+`<button class="chip">${ic('add',18,'fill:var(--chipt)')}</button>`;

function openArchived(){showArchived=true;$('#homeTitle').innerHTML=`<span style="display:flex;align-items:center;gap:14px"><button class="ibtn" id="arBack">${ic('back')}</button>Archived</span>`;

function chatSelAction(a){
 const ids=[...chatSel];const cs=ids.map(chatById);
 if(a==='pin'){const v=!cs.every(c=>c.pinned);cs.forEach(c=>c.pinned=v)}
 if(a==='mute'){const v=!cs.every(c=>c.muted);cs.forEach(c=>c.muted=v)}
 if(a==='arch'){cs.forEach(c=>c.archived=!c.archived);toast(ids.length+' chat'+(ids.length>1?'s':'')+' '+(cs[0].archived?'archived':'unarchived'))}
 if(a==='del'){back(()=>dialog(`Delete ${ids.length>1?ids.length+' chats':'this chat'}?`,'',[['Cancel'],['Delete chat',()=>{S.chats=S.chats.filter(c=>!ids.includes(c.id));save();renderHome()}]],true));return}
 if(a==='more'){back(()=>{});return}
 save();back();
}

function dialog(title,text,btns,horiz,input){const o=document.createElement('div');o.className='overlay dim';
 o.innerHTML=`<div class="dialog">${title?`<h4>${esc(title)}</h4>`:''}${text?`<p>${esc(text)}</p>`:''}${input!==undefined?`<input id="dlgIn" value="${esc(input)}">`:''}<div class="acts ${horiz?'h':''}">${btns.map((b,i)=>`<button data-i="${i}">${esc(b[0])}</button>`).join('')}</div></div>`;

function fieldHTML(f,i){const v=f.val??'';const lab=f.label?`<label>${esc(f.label)}</label>`:'';

  case 'area':return lab+`<textarea data-f="${i}" rows="3">${esc(v)}</textarea>`;
  case 'select':return lab+`<select data-f="${i}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  case 'day':return lab+dayPickerHTML(`data-f="${i}"`,v);
  case 'time':return lab+`<input type="time" data-f="${i}" value="${esc(v)}">`;
  case 'dp':return lab+dpFieldHTML(i,v,f.name);
  case 'num':return lab+`<input type="number" data-f="${i}" value="${esc(v)}">`;
  case 'check':return `<label><input type="checkbox" data-f="${i}" ${v?'checked':''}>${esc(f.label)}</label>`;
  case 'color':return lab+`<div class="efcol"><input type="color" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#1f7aec'}" data-cp="${i}"><input type="text" data-f="${i}" value="${esc(v)}"></div>`;
  default:return lab+`<input type="text" data-f="${i}" value="${esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`}}

 const row=(id,icon,title,sub,right='')=>`<div class="irow" id="${id}">${ic(icon)}<div style="flex:1"><div>${title}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>${right}</div>`;
 $('#aux').innerHTML=`<div class="topbar" style="padding-left:4px"><button class="ibtn" onclick="back()">${ic('back')}</button><div class="title">App settings</div></div><div class="scroll">
 <div class="tgrp">Recording</div>
 ${row('asMode','edit','Edit mode',EDIT()?'On – long-press anything to edit it, drag to reorder. Turn off before recording.':'Off – Demo mode. The app behaves like a normal messenger.',tg(EDIT()))}
 ${row('asChipT','person','Show "Sending as" chip',st.showAsChip?'On – in Edit mode a chip above the message box lets you pick who you type as.':'Off – messages always go as You.',tg(st.showAsChip))}
 <div class="hint2">To send a message as someone else without the chip:<br>• <b>Long-press Send</b> – sends the typed text as the other person (in a group you pick who).<br>• Or send it as You, then (Edit mode) <b>long-press the message → change "From"</b>.</div>
 ${row('asTime','timer','New message time',timeSummary())}
 ${row('asAuto','chatb','Scripted auto-replies','Replies you set per chat play after you send',tg(st.autoReply))}
 ${row('asTyping','chatb','Typing bubble','Show the "…" bubble while someone is typing',tg(st.typingBubble))}
 ${row('asTicks','check','Ticks timing',`Delivered after ${st.d1}s · Read after ${st.d2}s · Stops at: ${st.finalTick}`)}
 <div class="tgrp">Chats</div>
 ${row('asPeople','contact','Profile photos','Photo for each name – shows in every chat')}
 ${row('asScope','edit','Renaming a sender changes',st.renameScope==='all'?'Every message with the same name':'Only that message')}
 ${row('asEnc','lock','Encryption notice in chats','',tg(st.enc))}
 ${row('asClock','timer','24-hour clock',st.h24?'18:42':'6:42 pm',tg(st.h24))}
 <div class="tgrp">Look</div>
 ${row('asTheme','image','Theme colours','Every colour, light & dark, presets')}
 ${row('asName','edit','App name',esc(appName()))}
 <div class="tgrp">Data</div>
 ${row('asStudio','data','Open Studio','Full editor: all chats, messages, scripted replies')}
 ${row('asExp','doc','Export backup','Save all chats and settings as a file')}
 ${row('asImp','doc','Import backup','')}
 ${row('asReset','del','Reset to sample chats','')}
 <div class="tgrp">Tips</div>
 <div class="hint2">• Swipe a message right to reply. Hold the mic to record a voice note.<br>• Edit mode: long-press a chat title, message, date label, status, call or member to edit it; long-press and drag to reorder chats and messages.<br>• Long-press the app title on the chats screen (Edit mode) for Rename / Studio / Theme.</div>
 <div style="height:40px"></div></div>`;
 const on=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f};const flip=k=>{S.settings[k]=!S.settings[k];save();applyTheme();refreshAll()};
 on('asMode',()=>setMode(!EDIT()));on('asChipT',()=>flip('showAsChip'));on('asAuto',()=>flip('autoReply'));on('asTyping',()=>flip('typingBubble'));on('asEnc',()=>flip('enc'));on('asClock',()=>flip('h24'));
 on('asTime',()=>formSheet('New message time',[{k:'timeMode',label:'Base time',type:'select',opts:[['now','Current time (phone clock)'],['follow','Previous message in the chat']],val:st.timeMode},{k:'nowGapMin',label:'Current time: add at least (min)',type:'num',val:st.nowGapMin,half:1},{k:'nowGapMax',label:'…and at most (min)',type:'num',val:st.nowGapMax,half:1},{k:'followGapMin',label:'Previous message: add at least (min)',type:'num',val:st.followGapMin,half:1},{k:'followGapMax',label:'…and at most (min)',type:'num',val:st.followGapMax,half:1}],v=>{Object.assign(st,v);['nowGapMin','nowGapMax','followGapMin','followGapMax'].forEach(k=>st[k]=Math.max(0,Math.min(1439,Math.round(st[k]||0))))}));
 on('asTicks',()=>formSheet('Ticks timing',[{k:'d1',label:'Delivered after (seconds)',type:'num',val:st.d1,half:1},{k:'d2',label:'Read after (seconds)',type:'num',val:st.d2,half:1},{k:'finalTick',label:'Ticks stop at',type:'select',opts:[['sent','✓ Sent'],['delivered','✓✓ Delivered'],['read','✓✓ Read (blue)']],val:st.finalTick}],v=>Object.assign(st,v)));
 on('asPeople',openPeople);on('asTheme',openTheme);on('asName',renameApp);
 on('asScope',()=>dialog('Renaming a sender changes','',[['Only that message',()=>{st.renameScope='one';save();refreshAll()}],['Every message with the same name',()=>{st.renameScope='all';save();refreshAll()}],['Cancel']]));
 on('asStudio',()=>openStudio());
 on('asExp',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='chatly-backup.json';a.click()});
 on('asImp',()=>pickFile('#fileAny',f=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.chats)throw 0;S=d;load2();if(!S.people)S.people=seedPeople();save();applyTheme();refreshAll();toast('Imported')}catch(e){toast('Invalid file')}};r.readAsText(f)}));
 on('asReset',()=>dialog('Reset to sample chats?','All your chats and settings will be replaced.',[['Cancel'],['Reset',()=>{S=seed();S.people=seedPeople();save();applyTheme();refreshAll()}]],true))}

/* ================= DRAG TO REORDER (Edit mode) ================= */
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(e.target.closest('img,.crow,.row,.sys,.scard,.chrow'))e.preventDefault()});
let dragConsumed=false;
function makeDrag(box,selector,opt){let d=null,raf=0;
 const rowsFor=row=>[...box.querySelectorAll(selector)].filter(r=>!opt.group||opt.group(r)===opt.group(row));
 box.addEventListener('pointerdown',e=>{dragConsumed=false;if(!opt.enabled())return;const row=e.target.closest(selector);if(!row||!box.contains(row))return;
  d={row,x0:e.clientX,y0:e.clientY,y:e.clientY,lifted:false,moving:false};
  d.t=setTimeout(()=>{if(!d)return;d.lifted=true;dragConsumed=true;row._lp=1;row.classList.add('lifted');document.body.classList.add('dragging-on');if(navigator.vibrate)navigator.vibrate(20)},450)});
 box.addEventListener('touchmove',e=>{if(d&&d.lifted)e.preventDefault()},{passive:false});
 box.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x0,dy=e.clientY-d.y0;
  if(!d.lifted){if(Math.abs(dx)>9||Math.abs(dy)>9){clearTimeout(d.t);d=null}return}
  d.y=e.clientY;if(!d.moving&&Math.abs(dy)>6)start();if(d.moving)layout()});
 function start(){d.moving=true;d.rows=rowsFor(d.row);d.idx=d.rows.indexOf(d.row);d.to=d.idx;d.sc=opt.scroller();d.s0=d.sc.scrollTop;
  d.rects=d.rows.map(r=>r.getBoundingClientRect());const r0=d.rects[d.idx];let gap=0;if(d.rows.length>1){const j=d.idx>0?d.idx-1:d.idx+1;const a=d.rects[Math.min(j,d.idx)],b=d.rects[Math.max(j,d.idx)];gap=Math.max(0,b.top-a.bottom)}d.H=r0.height+gap;
  d.rows.forEach(r=>{r.style.transition='transform .15s';r.style.position='relative'});d.row.style.transition='none';d.row.style.zIndex=6;tick()}
 function layout(){const off=(d.y-d.y0)+(d.sc.scrollTop-d.s0);d.row.style.transform=`translateY(${off}px)`;const r0=d.rects[d.idx];const mid=r0.top+r0.height/2+off;let to=d.idx;
  for(let i=d.idx+1;i<d.rows.length;i++){const r=d.rects[i];if(mid>r.top+r.height/2)to=i}
  for(let i=d.idx-1;i>=0;i--){const r=d.rects[i];if(mid<r.top+r.height/2)to=i}
  d.to=to;d.rows.forEach((r,i)=>{if(i===d.idx)return;let t=0;if(to>d.idx&&i>d.idx&&i<=to)t=-d.H;if(to<d.idx&&i<d.idx&&i>=to)t=d.H;r.style.transform=t?`translateY(${t}px)`:''})}
 function tick(){if(!d||!d.moving)return;const sr=d.sc.getBoundingClientRect();let v=0;if(d.y<sr.top+70)v=-Math.ceil((sr.top+70-d.y)/6);else if(d.y>sr.bottom-70)v=Math.ceil((d.y-(sr.bottom-70))/6);if(v){d.sc.scrollTop+=v;layout()}raf=requestAnimationFrame(tick)}
 function finish(cancel){if(!d)return;clearTimeout(d.t);cancelAnimationFrame(raf);const x=d;d=null;document.body.classList.remove('dragging-on');x.row.classList.remove('lifted');
  if(x.rows)x.rows.forEach(r=>{r.style.transform='';r.style.transition='';r.style.zIndex='';r.style.position=''});
  if(cancel||!x.lifted)return;if(!x.moving){opt.onTap(x.row);return}if(x.to!==x.idx)opt.onDrop(x.row,x.rows,x.idx,x.to);else opt.after&&opt.after()}
 box.addEventListener('pointerup',()=>finish(false));box.addEventListener('pointercancel',()=>finish(!(d&&d.moving)));}
// home chat list
makeDrag($('#chatList'),'.crow[data-id]',{enabled:()=>EDIT()&&!chatSel.size&&!$('#search').value.trim()&&(filter==='all'||showArchived),scroller:()=>$('#chatScroll'),group:r=>r.dataset.pin,
 onTap:row=>editChatInfo(chatById(row.dataset.id)),
 onDrop:(row,rows,from,to)=>{const ids=[...$('#chatList').querySelectorAll('.crow[data-id]')].map(r=>r.dataset.id);const id=row.dataset.id;ids.splice(ids.indexOf(id),1);
  const target=rows[to].dataset.id;let at=ids.indexOf(target);if(to>from)at++;ids.splice(at,0,id);
  const rest=visibleChatsAll().filter(c=>!ids.includes(c.id));[...ids.map(chatById),...rest].forEach((c,i)=>c.ord=i);S.settings.manualOrder=true;save();renderChats()}});
function visibleChatsAll(){const key=c=>{const m=lastMsg(c);return m?tsOf(m.day,m.t):0};const ord=c=>c.ord===undefined||c.ord===null?Infinity:c.ord;
 return S.chats.slice().sort((a,b)=>(!!b.pinned-!!a.pinned)||(S.settings.manualOrder?((ord(a)-ord(b))||key(b)-key(a)):key(b)-key(a)))}
// messages inside a chat
makeDrag($('#msgs'),'.row[data-id], .sys[data-id]',{enabled:()=>EDIT()&&!sel.size&&!!cur,scroller:()=>$('#msgs'),
 onTap:row=>{const m=msgById(row.dataset.id);if(m)editMsg(cur,m)},
 onDrop:(row,rows,from,to)=>{const c=cur;const m=msgById(row.dataset.id);const t=msgById(rows[to].dataset.id);if(!m||!t)return;
  c.messages.splice(c.messages.indexOf(m),1);let at=c.messages.indexOf(t);if(to>from)at++;c.messages.splice(at,0,m);
  m.day=t.day|0;const [th,tm]=(t.t||'09:00').split(':').map(Number);const x=Math.max(0,Math.min(1439,th*60+tm+(to>from?1:-1)));m.t=pad(Math.floor(x/60))+':'+pad(x%60);save();renderMsgs(true)}});

AUXFILL.settings=fillSettings;AUXFILL.appset=fillAppSettings;AUXFILL.theme=fillTheme;AUXFILL.people=fillPeople;
/* ================= INIT ================= */
$('#search').addEventListener('input',renderChats);
applyTheme();history.replaceState({root:1},'');renderHome();renderPill();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(tab==='chats'&&!cur)renderChats()}});
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
